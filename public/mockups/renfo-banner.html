<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Renfo banner mockup v5 (motion + export)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  svg { display: block; width: 100vw; height: 100vh; }
  .headline { font-family: "SF Pro Rounded", ui-rounded, -apple-system, system-ui, sans-serif; font-weight: 700; letter-spacing: -4px; }
  .label { font-family: -apple-system, system-ui, sans-serif; font-weight: 600; }
  .panel { position: fixed; top: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; width: 300px; padding: 14px; border-radius: 18px; background: rgba(20, 8, 10, 0.82); color: #fff; font: 13px/1.35 -apple-system, system-ui, sans-serif; backdrop-filter: blur(20px); }
  .panel button { padding: 9px 12px; border: 0; border-radius: 10px; background: #F6D86C; color: #2A0306; font: 600 13px -apple-system, system-ui, sans-serif; text-align: left; cursor: pointer; }
  .panel button:disabled { opacity: 0.5; cursor: default; }
  .panel p { margin: 0; color: rgba(255, 255, 255, 0.75); }
</style>
</head>
<body>
<svg id="art" viewBox="0 0 5244 2950" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="72%">
      <stop offset="0" stop-color="#B8212B"/>
      <stop offset="0.5" stop-color="#7E0F18"/>
      <stop offset="1" stop-color="#1C090B"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F6D86C"/>
      <stop offset="1" stop-color="#D6A436"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7DC86" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#F7DC86" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2A0306" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <!-- Renfo mark, traced from the logo; origin is the bottom tip -->
    <g id="mark" transform="translate(-400 -738)" fill="url(#gold)">
      <path d="M178 345 L138 140 Q136 124 152 130 L245 186 Q285 205 310 170 L388 68 Q400 55 412 68 L490 170 Q515 205 555 186 L648 130 Q664 124 662 140 L628 330 Q625 345 610 345 L525 345 Q480 265 400 265 Q320 265 275 345 Z"/>
      <path d="M185 392 L248 392 Q258 392 258 405 Q258 470 300 515 L392 608 Q400 615 408 608 L500 515 Q545 470 545 405 Q545 392 556 392 L615 392 Q625 392 625 402 Q625 500 560 575 L412 732 Q400 742 388 732 L240 575 Q177 500 177 402 Q177 392 185 392 Z"/>
      <path d="M400 512 L345 455 Q325 432 325 405 A75 75 0 1 1 475 405 Q475 432 455 455 Z"/>
    </g>
    <!-- masks that draw each route toward the hero -->
    <mask id="draw-left" maskUnits="userSpaceOnUse" x="0" y="0" width="5244" height="2950">
      <path id="reveal-left" d="M1050 1330 C1120 1560 1300 1760 1520 1760 S1850 1420 2070 1440 S2440 1760 2622 1820" fill="none" stroke="#fff" stroke-width="80" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="0"/>
    </mask>
    <mask id="draw-right" maskUnits="userSpaceOnUse" x="0" y="0" width="5244" height="2950">
      <path id="reveal-right" d="M4180 1290 C4060 1500 3640 1690 3320 1650 S2850 1730 2622 1820" fill="none" stroke="#fff" stroke-width="80" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="0"/>
    </mask>
  </defs>

  <rect width="5244" height="2950" fill="url(#bg)"/>

  <g id="journey">
    <!-- two uneven routes converging on the next faire -->
    <g fill="none" stroke="#F7DC86" stroke-opacity="0.6" stroke-width="11" stroke-dasharray="4 36" stroke-linecap="round">
      <path mask="url(#draw-left)" d="M1050 1330 C1120 1560 1300 1760 1520 1760 S1850 1420 2070 1440 S2440 1760 2622 1820"/>
      <path mask="url(#draw-right)" d="M4180 1290 C4060 1500 3640 1690 3320 1650 S2850 1730 2622 1820"/>
    </g>

    <!-- faires along the way: smaller and higher is farther, bigger and lower is closer -->
    <g filter="url(#shadow)">
      <g transform="translate(1050 1330)"><g class="pin" data-at="300"><use href="#mark" transform="scale(0.38)"/></g></g>
      <g transform="translate(1520 1760)"><g class="pin" data-at="1150"><use href="#mark" transform="scale(0.52)"/></g></g>
      <g transform="translate(2070 1440)"><g class="pin" data-at="1900"><use href="#mark" transform="scale(0.42)"/></g></g>
      <g transform="translate(4180 1290)"><g class="pin" data-at="800"><use href="#mark" transform="scale(0.38)"/></g></g>
      <g transform="translate(3320 1650)"><g class="pin" data-at="1750"><use href="#mark" transform="scale(0.48)"/></g></g>
    </g>
  </g>

  <!-- the next faire, planted on the map -->
  <circle id="glow-disc" cx="2622" cy="1560" r="600" fill="url(#glow)"/>
  <ellipse cx="2622" cy="1818" rx="120" ry="20" fill="#2A0306" opacity="0.35" filter="url(#soft)"/>
  <g transform="translate(2622 1820)" filter="url(#shadow)"><g id="hero"><use href="#mark" transform="scale(0.85)"/></g></g>

  <!-- site version only; the App Store crop drops it -->
  <text id="headline" class="headline" x="2622" y="860" text-anchor="middle" font-size="210" fill="#FFF6E6">Your next faire awaits.</text>

  <!-- 21:9 header crop marks -->
  <g id="marks">
    <rect x="0" y="351" width="5244" height="2248" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="40 30"/>
    <text class="label" x="60" y="320" font-size="80" fill="#FFFFFF" fill-opacity="0.8">App Store header crop, 21:9 (scales to 3840 × 1646)</text>
    <text class="label" x="60" y="2720" font-size="80" fill="#FFFFFF" fill-opacity="0.8">Full canvas: universal 16:9, 5244 × 2950 (site version, with headline)</text>
  </g>
</svg>

<div class="panel">
  <button id="save-video">Save header video · 3840 × 1646 MP4</button>
  <button id="save-poster">Save header poster frame · 3840 × 1646 PNG</button>
  <button id="save-universal">Save universal image · 5244 × 2950 PNG</button>
  <p id="status">Use desktop Chrome or Edge. The video takes a minute or two to render.</p>
</div>

<script>
  const art = document.getElementById("art");
  if (location.search.includes("header")) {
    art.setAttribute("viewBox", "0 351 5244 2248");
    document.getElementById("marks").style.display = "none";
    document.getElementById("headline").style.display = "none";
  }

  // An 8 second loop: the routes draw toward the centre, each faire pops in as
  // its route reaches it, the hero lands, everything holds, then the journey
  // fades so the loop starts clean. The hero and glow never leave.
  // frame(t) sets every animated attribute for time t, so playback and export
  // render exactly the same frames.
  const LOOP = 8000;
  const LAND = 2600;
  const POSTER = 5000;
  const FPS = 30;

  const clamp = (v) => Math.min(1, Math.max(0, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const inOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const out = (p) => 1 - (1 - p) * (1 - p);
  const back = (p) => 1 + 2.4 * Math.pow(p - 1, 3) + 1.4 * Math.pow(p - 1, 2);

  const els = {
    left: document.getElementById("reveal-left"),
    right: document.getElementById("reveal-right"),
    journey: document.getElementById("journey"),
    hero: document.getElementById("hero"),
    glow: document.getElementById("glow-disc"),
    pins: [...document.querySelectorAll(".pin")]
  };

  function frame(t) {
    els.left.setAttribute("stroke-dashoffset", 1 - inOut(seg(t, 300, LAND)));
    els.right.setAttribute("stroke-dashoffset", 1 - inOut(seg(t, 800, LAND)));
    els.journey.setAttribute("opacity", 1 - inOut(seg(t, 6800, 7500)));

    for (const pin of els.pins) {
      const p = seg(t, Number(pin.dataset.at), Number(pin.dataset.at) + 450);
      const e = back(p);
      pin.setAttribute("opacity", p);
      pin.setAttribute("transform", `translate(0 ${-150 * (1 - e)}) scale(${0.6 + 0.4 * e})`);
    }

    let y = 0, sx = 1, sy = 1;
    if (t >= LAND - 250 && t < LAND) {
      y = -70 * out(seg(t, LAND - 250, LAND));
    } else if (t >= LAND && t < LAND + 220) {
      const p = seg(t, LAND, LAND + 220);
      y = -70 * (1 - p * p);
      sx = 1 + 0.06 * p;
      sy = 1 - 0.07 * p;
    } else if (t >= LAND + 220 && t < LAND + 520) {
      const p = out(seg(t, LAND + 220, LAND + 520));
      sx = 1.06 - 0.06 * p;
      sy = 0.93 + 0.07 * p;
    }
    els.hero.setAttribute("transform", `translate(0 ${y}) scale(${sx} ${sy})`);

    const g = t < LAND ? 0.7 + 0.05 * (t / LAND)
      : t < LAND + 400 ? 0.75 + 0.25 * inOut(seg(t, LAND, LAND + 400))
      : t < 5500 ? 1 - 0.2 * inOut(seg(t, LAND + 400, 5500))
      : 0.8 - 0.1 * inOut(seg(t, 5500, LOOP));
    els.glow.setAttribute("opacity", g);
  }

  let playing = true;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    frame(POSTER);
  } else {
    const start = performance.now();
    const tick = (now) => {
      if (playing) frame((now - start) % LOOP);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  // Export: render a clean copy of the art (no marks, no headline) to a canvas.
  const HEADER = { viewBox: "0 351 5244 2248", width: 3840, height: 1646 };
  const UNIVERSAL = { viewBox: "0 0 5244 2950", width: 5244, height: 2950 };
  const status = document.getElementById("status");
  const buttons = [...document.querySelectorAll(".panel button")];

  async function render(view, t, canvas) {
    frame(t);
    const copy = art.cloneNode(true);
    copy.querySelector("#marks").remove();
    copy.querySelector("#headline").remove();
    copy.setAttribute("viewBox", view.viewBox);
    copy.setAttribute("width", view.width);
    copy.setAttribute("height", view.height);
    copy.removeAttribute("id");
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(copy)], { type: "image/svg+xml" }));
    const img = new Image();
    img.src = url;
    await img.decode();
    const ctx = canvas.getContext("2d", { alpha: false });
    ctx.drawImage(img, 0, 0, view.width, view.height);
    URL.revokeObjectURL(url);
  }

  function canvasFor(view) {
    const canvas = document.createElement("canvas");
    canvas.width = view.width;
    canvas.height = view.height;
    return canvas;
  }

  function download(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }

  async function busy(task) {
    buttons.forEach((b) => (b.disabled = true));
    playing = false;
    try {
      await task();
    } catch (error) {
      status.textContent = `Something went wrong: ${error.message}. Send me a screenshot of this.`;
    } finally {
      playing = true;
      buttons.forEach((b) => (b.disabled = false));
    }
  }

  async function savePng(view, name) {
    const canvas = canvasFor(view);
    await render(view, POSTER, canvas);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
    download(blob, name);
    status.textContent = `Saved ${name}.`;
  }

  document.getElementById("save-poster").onclick = () => busy(() => savePng(HEADER, "renfo-header-poster-3840x1646.png"));
  document.getElementById("save-universal").onclick = () => busy(() => savePng(UNIVERSAL, "renfo-universal-5244x2950.png"));

  if (/Firefox\//.test(navigator.userAgent)) {
    status.textContent = "Firefox can't save the video at this size yet. Open this page in Edge or Chrome for the MP4; the PNGs work here.";
  }

  document.getElementById("save-video").onclick = () => busy(async () => {
    if (!("VideoEncoder" in window)) throw new Error("this browser can't encode video, use desktop Chrome or Edge");
    status.textContent = "Loading the video encoder…";
    const { Muxer, ArrayBufferTarget } = await import("https://cdn.jsdelivr.net/npm/mp4-muxer@5/+esm");

    // Hardware encoders often stop short of this size, and Chrome's software
    // H.264 encoder only does Baseline, so try every profile both ways, then HEVC.
    const base = { width: HEADER.width, height: HEADER.height, bitrate: 25_000_000, framerate: FPS };
    const candidates = [
      ["avc", "avc1.640033"], ["avc", "avc1.640034"], ["avc", "avc1.4d0033"], ["avc", "avc1.4d0034"],
      ["avc", "avc1.42e033"], ["avc", "avc1.42e034"], ["avc", "avc1.42e03c"],
      ["hevc", "hvc1.1.6.L153.B0"], ["hevc", "hvc1.1.6.L156.B0"]
    ];
    let config = null, family = null;
    search: for (const [kind, codec] of candidates) {
      for (const hardwareAcceleration of ["no-preference", "prefer-software", "prefer-hardware"]) {
        const attempt = { ...base, codec, hardwareAcceleration };
        if (kind === "avc") attempt.avc = { format: "avc" };
        try {
          const { supported } = await VideoEncoder.isConfigSupported(attempt);
          if (supported) { config = attempt; family = kind; break search; }
        } catch {}
      }
    }
    if (!config) throw new Error(`no H.264 or HEVC encoder in this browser handles 3840 × 1646 (${navigator.userAgent})`);
    status.textContent = `Encoding with ${config.codec} (${config.hardwareAcceleration})…`;

    const target = new ArrayBufferTarget();
    const muxer = new Muxer({ target, video: { codec: family, width: HEADER.width, height: HEADER.height, frameRate: FPS }, fastStart: "in-memory" });
    let failure = null;
    const encoder = new VideoEncoder({
      output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
      error: (e) => { failure = e; }
    });
    encoder.configure(config);

    const canvas = canvasFor(HEADER);
    const total = (LOOP / 1000) * FPS;
    for (let i = 0; i < total; i++) {
      if (failure) throw failure;
      await render(HEADER, (i * 1000) / FPS, canvas);
      const videoFrame = new VideoFrame(canvas, { timestamp: Math.round((i * 1e6) / FPS), duration: Math.round(1e6 / FPS) });
      encoder.encode(videoFrame, { keyFrame: i % FPS === 0 });
      videoFrame.close();
      while (encoder.encodeQueueSize > 4) await new Promise((r) => setTimeout(r, 10));
      status.textContent = `Rendering frame ${i + 1} of ${total} with ${config.codec}…`;
    }
    await encoder.flush();
    if (failure) throw failure;
    muxer.finalize();
    download(new Blob([target.buffer], { type: "video/mp4" }), "renfo-header-3840x1646.mp4");
    status.textContent = `Saved renfo-header-3840x1646.mp4 (8 seconds, 30 fps, ${family === "hevc" ? "HEVC" : "H.264"}, loops seamlessly).`;
  });
</script>
</body>
</html>
