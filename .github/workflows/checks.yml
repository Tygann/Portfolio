name: Site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:build
      - run: npm run check:routing
      - run: npm run check:metadata
      - run: npm run check:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: |
            .codex-previews/
            test-results/
          retention-days: 7
