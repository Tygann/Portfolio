<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Homestead banner mockup v2 (motion + export)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  svg { display: block; width: 100vw; height: 100vh; }
  .headline { font-family: "SF Pro Rounded", ui-rounded, -apple-system, system-ui, sans-serif; font-weight: 700; letter-spacing: -4px; }
  .label { font-family: -apple-system, system-ui, sans-serif; font-weight: 600; }
  .panel { position: fixed; top: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; width: 300px; padding: 14px; border-radius: 18px; background: rgba(6, 14, 30, 0.82); color: #fff; font: 13px/1.35 -apple-system, system-ui, sans-serif; backdrop-filter: blur(20px); }
  .panel button { padding: 9px 12px; border: 0; border-radius: 10px; background: #2F7BE0; color: #fff; font: 600 13px -apple-system, system-ui, sans-serif; text-align: left; cursor: pointer; }
  .panel button:disabled { opacity: 0.5; cursor: default; }
  .panel p { margin: 0; color: rgba(255, 255, 255, 0.75); }
  .panel a { color: #8FC2FF; }
</style>
</head>
<body>
<svg id="art" viewBox="0 0 5244 2950" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="72%">
      <stop offset="0" stop-color="#1E56B8"/>
      <stop offset="0.5" stop-color="#0F2A5C"/>
      <stop offset="1" stop-color="#0B1526"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD35E"/><stop offset="1" stop-color="#FFA81F"/></linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.07"/></linearGradient>
    <radialGradient id="warm" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFD978" stop-opacity="0.38"/><stop offset="1" stop-color="#FFD978" stop-opacity="0"/></radialGradient>
    <radialGradient id="cool" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8FE3D4" stop-opacity="0.22"/><stop offset="1" stop-color="#8FE3D4" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#030A18" flood-opacity="0.5"/></filter>

    <!-- Glyphs drawn in a 100 × 100 box. -->
    <g id="g-lock"><path d="M33 46 V33 A17 17 0 0 1 67 33 V46" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><rect x="21" y="44" width="58" height="46" rx="11" fill="currentColor"/></g>
    <g id="g-thermo"><rect x="38" y="8" width="24" height="60" rx="12" fill="none" stroke="currentColor" stroke-width="8"/><path d="M50 70 V36" stroke="currentColor" stroke-width="10" stroke-linecap="round"/><circle cx="50" cy="75" r="17" fill="currentColor"/></g>
    <g id="g-bulb" fill="currentColor"><path d="M50 6 C29 6 15 22 15 41 C15 54 22 62 29 70 C33 75 35 78 35 82 L65 82 C65 78 67 75 71 70 C78 62 85 54 85 41 C85 22 71 6 50 6 Z"/><rect x="36" y="86" width="28" height="6" rx="3"/><rect x="41" y="94" width="18" height="5" rx="2.5"/></g>
    <g id="g-moon"><path d="M60 12 A39 39 0 1 0 88 64 A31 31 0 1 1 60 12 Z" fill="currentColor"/></g>
    <g id="g-history"><path d="M10 75 L28 57 L44 67 L62 39 L78 49 L90 29" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90" cy="29" r="8" fill="currentColor"/></g>

    <!-- A Home-style control tile, 100 units square, centred on its origin -->
    <rect id="frost-tile" x="-50" y="-50" width="100" height="100" rx="26" fill="url(#frost)" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.2"/>
  </defs>

  <rect width="5244" height="2950" fill="url(#bg)"/>
  <circle cx="2622" cy="1800" r="990" fill="url(#cool)"/>
  <circle id="warm-glow" cx="2622" cy="1800" r="680" fill="url(#warm)"/>

  <!-- controls around the home: smaller and higher is farther, the light in front -->
  <g id="room" filter="url(#shadow)">
    <!-- centres set so every gap between neighbouring tiles is the same 170 units -->
    <g transform="translate(1284 1618) scale(3.95)"><g class="tile" data-at="300"><use href="#frost-tile"/><use href="#g-lock" color="#CFE0FF" opacity="0.85" transform="translate(-28 -28) scale(0.56)"/></g></g>
    <g transform="translate(1890.5 1748) scale(4.78)"><g class="tile" data-at="800"><use href="#frost-tile"/><use href="#g-thermo" color="#CFE0FF" opacity="0.85" transform="translate(-28 -28) scale(0.56)"/></g></g>
    <g transform="translate(3353.5 1748) scale(4.78)"><g class="tile" data-at="950"><use href="#frost-tile"/><use href="#g-moon" color="#CFE0FF" opacity="0.85" transform="translate(-28 -28) scale(0.56)"/></g></g>
    <g transform="translate(3960 1618) scale(3.95)"><g class="tile" data-at="450"><use href="#frost-tile"/><use href="#g-history" color="#CFE0FF" opacity="0.85" transform="translate(-28 -28) scale(0.56)"/></g></g>
  </g>

  <!-- the light: off at first, then one tap and it's on -->
  <g transform="translate(2622 1800) scale(6.45)" filter="url(#shadow)">
    <g id="hero">
      <use href="#frost-tile"/>
      <use href="#g-bulb" color="#CFE0FF" opacity="0.85" transform="translate(-28 -28) scale(0.56)"/>
      <g id="hero-on">
        <rect x="-50" y="-50" width="100" height="100" rx="26" fill="url(#amber)"/>
        <use href="#g-bulb" color="#FFFFFF" transform="translate(-28 -28) scale(0.56)"/>
      </g>
    </g>
  </g>

  <!-- site version only; the App Store crop drops it -->
  <text id="headline" class="headline" x="2622" y="860" text-anchor="middle" font-size="210" fill="#F5F8FD">Your home, truly native.</text>

  <!-- 21:9 header crop marks -->
  <g id="marks">
    <rect x="0" y="351" width="5244" height="2248" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="40 30"/>
    <text class="label" x="60" y="320" font-size="80" fill="#FFFFFF" fill-opacity="0.8">App Store header crop, 21:9 (scales to 3840 × 1646)</text>
    <text class="label" x="60" y="2720" font-size="80" fill="#FFFFFF" fill-opacity="0.8">Full canvas: universal 16:9, 5244 × 2950 (site version, with headline)</text>
  </g>
</svg>

<div class="panel">
  <button id="save-video">Save header video · 3840 × 1646 MP4</button>
  <button id="save-poster">Save header poster frame · 3840 × 1646 PNG</button>
  <button id="save-universal">Save universal image · 5244 × 2950 PNG</button>
  <p id="status">Use desktop Chrome or Edge. The video takes a minute or two to render.</p>
  <p><a href="homestead-social.html">Link preview card →</a></p>
</div>

<script>
  const art = document.getElementById("art");
  if (location.search.includes("header")) {
    art.setAttribute("viewBox", "0 351 5244 2248");
    document.getElementById("marks").style.display = "none";
    document.getElementById("headline").style.display = "none";
  }

  // An 8 second loop: the controls drop into place from the outside in, then
  // the light is tapped: it presses, switches on and the warm glow blooms.
  // Everything holds, then the light goes off and the controls fade so the
  // loop starts clean. The light tile itself never leaves.
  // frame(t) sets every animated attribute for time t, so playback and export
  // render exactly the same frames.
  const LOOP = 8000;
  const TAP = 2400;
  const POSTER = 5000;
  const FPS = 30;

  const clamp = (v) => Math.min(1, Math.max(0, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const inOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const out = (p) => 1 - (1 - p) * (1 - p);
  const back = (p) => 1 + 2.4 * Math.pow(p - 1, 3) + 1.4 * Math.pow(p - 1, 2);

  const els = {
    room: document.getElementById("room"),
    hero: document.getElementById("hero"),
    on: document.getElementById("hero-on"),
    glow: document.getElementById("warm-glow"),
    tiles: [...document.querySelectorAll(".tile")]
  };

  function frame(t) {
    els.room.setAttribute("opacity", 1 - inOut(seg(t, 6800, 7500)));

    for (const tile of els.tiles) {
      const p = seg(t, Number(tile.dataset.at), Number(tile.dataset.at) + 450);
      const e = back(p);
      tile.setAttribute("opacity", p);
      tile.setAttribute("transform", `translate(0 ${-30 * (1 - e)}) scale(${0.6 + 0.4 * e})`);
    }

    // the tap: press in, then spring back as the light comes on
    let s = 1;
    if (t >= TAP && t < TAP + 140) s = 1 - 0.08 * out(seg(t, TAP, TAP + 140));
    else if (t >= TAP + 140 && t < TAP + 520) s = 0.92 + 0.08 * back(seg(t, TAP + 140, TAP + 520));
    els.hero.setAttribute("transform", `scale(${s})`);

    const on = inOut(seg(t, TAP + 100, TAP + 400)) * (1 - inOut(seg(t, 6900, 7500)));
    els.on.setAttribute("opacity", on);

    const g = t < TAP + 100 ? 0
      : t < TAP + 600 ? inOut(seg(t, TAP + 100, TAP + 600))
      : t < 5500 ? 1 - 0.2 * inOut(seg(t, TAP + 600, 5500))
      : 0.8 * (1 - inOut(seg(t, 6900, 7500)));
    els.glow.setAttribute("opacity", g);
  }

  let playing = true;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    frame(POSTER);
  } else {
    const start = performance.now();
    const tick = (now) => {
      if (playing) frame((now - start) % LOOP);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  // Export: render a clean copy of the art (no marks, no headline) to a canvas.
  const HEADER = { viewBox: "0 351 5244 2248", width: 3840, height: 1646 };
  const UNIVERSAL = { viewBox: "0 0 5244 2950", width: 5244, height: 2950 };
  const status = document.getElementById("status");
  const buttons = [...document.querySelectorAll(".panel button")];

  async function render(view, t, canvas) {
    frame(t);
    const copy = art.cloneNode(true);
    copy.querySelector("#marks").remove();
    copy.querySelector("#headline").remove();
    copy.setAttribute("viewBox", view.viewBox);
    copy.setAttribute("width", view.width);
    copy.setAttribute("height", view.height);
    copy.removeAttribute("id");
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(copy)], { type: "image/svg+xml" }));
    const img = new Image();
    img.src = url;
    await img.decode();
    const ctx = canvas.getContext("2d", { alpha: false });
    ctx.drawImage(img, 0, 0, view.width, view.height);
    URL.revokeObjectURL(url);
  }

  function canvasFor(view) {
    const canvas = document.createElement("canvas");
    canvas.width = view.width;
    canvas.height = view.height;
    return canvas;
  }

  function download(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }

  async function busy(task) {
    buttons.forEach((b) => (b.disabled = true));
    playing = false;
    try {
      await task();
    } catch (error) {
      status.textContent = `Something went wrong: ${error.message}. Send me a screenshot of this.`;
    } finally {
      playing = true;
      buttons.forEach((b) => (b.disabled = false));
    }
  }

  async function savePng(view, name) {
    const canvas = canvasFor(view);
    await render(view, POSTER, canvas);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
    download(blob, name);
    status.textContent = `Saved ${name}.`;
  }

  document.getElementById("save-poster").onclick = () => busy(() => savePng(HEADER, "homestead-header-poster-3840x1646.png"));
  document.getElementById("save-universal").onclick = () => busy(() => savePng(UNIVERSAL, "homestead-universal-5244x2950.png"));

  if (/Firefox\//.test(navigator.userAgent)) {
    status.textContent = "Firefox can't save the video at this size yet. Open this page in Edge or Chrome for the MP4; the PNGs work here.";
  }

  document.getElementById("save-video").onclick = () => busy(async () => {
    if (!("VideoEncoder" in window)) throw new Error("this browser can't encode video, use desktop Chrome or Edge");
    status.textContent = "Loading the video encoder…";
    const { Muxer, ArrayBufferTarget } = await import("https://cdn.jsdelivr.net/npm/mp4-muxer@5/+esm");

    // Hardware encoders often stop short of this size, and Chrome's software
    // H.264 encoder only does Baseline, so try every profile both ways, then HEVC.
    const base = { width: HEADER.width, height: HEADER.height, bitrate: 25_000_000, framerate: FPS };
    const candidates = [
      ["avc", "avc1.640033"], ["avc", "avc1.640034"], ["avc", "avc1.4d0033"], ["avc", "avc1.4d0034"],
      ["avc", "avc1.42e033"], ["avc", "avc1.42e034"], ["avc", "avc1.42e03c"],
      ["hevc", "hvc1.1.6.L153.B0"], ["hevc", "hvc1.1.6.L156.B0"]
    ];
    let config = null, family = null;
    search: for (const [kind, codec] of candidates) {
      for (const hardwareAcceleration of ["no-preference", "prefer-software", "prefer-hardware"]) {
        const attempt = { ...base, codec, hardwareAcceleration };
        if (kind === "avc") attempt.avc = { format: "avc" };
        try {
          const { supported } = await VideoEncoder.isConfigSupported(attempt);
          if (supported) { config = attempt; family = kind; break search; }
        } catch {}
      }
    }
    if (!config) throw new Error(`no H.264 or HEVC encoder in this browser handles 3840 × 1646 (${navigator.userAgent})`);
    status.textContent = `Encoding with ${config.codec} (${config.hardwareAcceleration})…`;

    const target = new ArrayBufferTarget();
    const muxer = new Muxer({ target, video: { codec: family, width: HEADER.width, height: HEADER.height, frameRate: FPS }, fastStart: "in-memory" });
    let failure = null;
    const encoder = new VideoEncoder({
      output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
      error: (e) => { failure = e; }
    });
    encoder.configure(config);

    const canvas = canvasFor(HEADER);
    const total = (LOOP / 1000) * FPS;
    for (let i = 0; i < total; i++) {
      if (failure) throw failure;
      await render(HEADER, (i * 1000) / FPS, canvas);
      const videoFrame = new VideoFrame(canvas, { timestamp: Math.round((i * 1e6) / FPS), duration: Math.round(1e6 / FPS) });
      encoder.encode(videoFrame, { keyFrame: i % FPS === 0 });
      videoFrame.close();
      while (encoder.encodeQueueSize > 4) await new Promise((r) => setTimeout(r, 10));
      status.textContent = `Rendering frame ${i + 1} of ${total} with ${config.codec}…`;
    }
    await encoder.flush();
    if (failure) throw failure;
    muxer.finalize();
    download(new Blob([target.buffer], { type: "video/mp4" }), "homestead-header-3840x1646.mp4");
    status.textContent = `Saved homestead-header-3840x1646.mp4 (8 seconds, 30 fps, ${family === "hevc" ? "HEVC" : "H.264"}, loops seamlessly).`;
  });
</script>
</body>
</html>
